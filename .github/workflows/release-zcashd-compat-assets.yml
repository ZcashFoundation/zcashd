name: Release zcashd compatibility assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v6.12.4"
        required: true

permissions:
  contents: write

# Runs for the same tag queue instead of overlapping, so a later run's asset check sees what the
# first run published.
concurrency:
  group: release-zcashd-compat-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-assets:
    name: Build zcashd compat (${{ matrix.name }})
    runs-on: ${{ vars.UBUNTU_LARGE_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            host: x86_64-pc-linux-gnu
            cross_deps: ""
    steps:
      # Build the tagged source, also for a manual run from another branch. The qualified ref
      # keeps a branch with the same name from being built instead.
      - uses: actions/checkout@v6.0.3
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Unable to resolve release tag." >&2
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # This repository tags sidecar releases as zebra-compat-vX.Y.Z, but the
          # packaging script and artifact names use the bare vX.Y.Z version.
          echo "version=${TAG#zebra-compat-}" >> "$GITHUB_OUTPUT"

      # Also push the unprefixed tag that the previous release publisher pushed.
      - name: Resolve Docker tags
        id: docker-tags
        shell: bash
        env:
          TAG: ${{ steps.release-tag.outputs.value }}
        run: |
          tags=("zakuracore/zcashd:${TAG}")
          if [[ "$TAG" == v* ]]; then
            tags+=("zakuracore/zcashd:${TAG#v}")
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Zakura pins the checksums of published assets, and a rebuilt image would differ from the
      # pushed one (the base image floats), so a rebuild must never replace either.
      - name: Refuse to rebuild a tag with published assets or images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-tag.outputs.value }}
          IMAGES: ${{ steps.docker-tags.outputs.tags }}
        run: |
          set -euo pipefail
          # Only a missing release or image may continue; any other lookup failure fails closed.
          status=$(curl -sS -o release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/$TAG")
          case "$status" in
            200)
              if jq -r '.assets[].name' release.json | grep -q '^zcashd-zebra-compat-'; then
                echo "::error::Release $TAG already has assets, which Zakura may pin. Publish a new tag instead."
                exit 1
              fi
              ;;
            404)
              echo "Release $TAG does not exist yet."
              ;;
            *)
              echo "::error::Looking up release $TAG failed with HTTP $status."
              exit 1
              ;;
          esac

          while read -r image; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://hub.docker.com/v2/namespaces/zakuracore/repositories/zcashd/tags/${image#*:}")
            case "$status" in
              200)
                echo "::error::Image $image already exists. To finish this run, use \"Re-run failed jobs\"; otherwise publish a new tag."
                exit 1
                ;;
              404)
                ;;
              *)
                echo "::error::Looking up image $image failed with HTTP $status."
                exit 1
                ;;
            esac
          done <<< "$IMAGES"

      - name: Install cross-compilation dependencies
        if: matrix.cross_deps != ''
        run: sudo apt update && sudo apt install -y ${{ matrix.cross_deps }}

      - name: Build zcashd
        env:
          HOST: ${{ matrix.host }}
        run: ./zcutil/build.sh -j"$(nproc)"

      - name: Package zcashd compatibility assets
        shell: bash
        run: |
          chmod +x ./zcutil/package-zcashd-compat.sh
          ./zcutil/package-zcashd-compat.sh \
            --host "${{ matrix.host }}" \
            --version "${{ steps.release-tag.outputs.version }}" \
            --output-dir "./artifacts/${{ matrix.name }}"

      # Upload before the Docker steps, so that a Docker failure cannot lose the assets.
      - name: Upload matrix artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zcashd-compat-${{ matrix.name }}
          path: ./artifacts/${{ matrix.name }}
          # Lets "Re-run failed jobs" retry a failed Docker step after this upload.
          overwrite: true

      - name: Prepare Docker build context
        if: matrix.name == 'linux-x86_64'
        shell: bash
        env:
          DOCKER_CONTEXT: ${{ runner.temp }}/zcashd-docker-context
        run: |
          set -euo pipefail
          rm -rf "$DOCKER_CONTEXT"
          mkdir -p "$DOCKER_CONTEXT"

          cp \
            ./src/zcashd \
            ./src/zcash-cli \
            ./src/zcash-tx \
            ./src/zcashd-wallet-tool \
            ./zcutil/fetch-params.sh \
            ./contrib/docker/entrypoint.sh \
            "$DOCKER_CONTEXT/"

      # The Docker Hub push only runs where the Zakura credentials exist (the upstream
      # valargroup repo). Secrets are unavailable in `if:` expressions, so probe via env.
      - name: Check for Docker Hub credentials
        id: dockerhub
        if: matrix.name == 'linux-x86_64'
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_ZAKURA }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_TOKEN_ZAKURA is not set; skipping the Docker Hub push." >&2
          fi

      - name: Set up Docker Buildx
        if: matrix.name == 'linux-x86_64' && steps.dockerhub.outputs.available == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        if: matrix.name == 'linux-x86_64' && steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: valaroman
          password: ${{ secrets.DOCKERHUB_TOKEN_ZAKURA }}

      - name: Build and push Docker image
        if: matrix.name == 'linux-x86_64' && steps.dockerhub.outputs.available == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ${{ runner.temp }}/zcashd-docker-context
          file: ./contrib/docker/source-runtime.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release-tag.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release-tag.outputs.value }}

  publish-assets:
    name: Publish zcashd compat assets
    needs: build-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Unable to resolve release tag." >&2
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./publish

      - name: Build consolidated manifest and checksums
        shell: bash
        run: |
          ./zcutil/consolidate-zcashd-compat-release.sh \
            --input-dir ./publish \
            --output-dir ./publish/final \
            --release-tag "${{ steps.release-tag.outputs.value }}" \
            --repository "${{ github.repository }}"

      # A release candidate is a prerelease, so it never becomes the latest release.
      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.value }}
          prerelease: ${{ contains(steps.release-tag.outputs.value, '-rc') }}
          files: ./publish/final/*
