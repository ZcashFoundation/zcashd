name: Release zcashd compatibility assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v6.12.4"
        required: true

permissions:
  contents: write

jobs:
  build-assets:
    name: Build zcashd compat (${{ matrix.name }})
    runs-on: ${{ vars.UBUNTU_LARGE_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            host: x86_64-pc-linux-gnu
            cross_deps: ""
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Unable to resolve release tag." >&2
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install cross-compilation dependencies
        if: matrix.cross_deps != ''
        run: sudo apt update && sudo apt install -y ${{ matrix.cross_deps }}

      - name: Build zcashd
        env:
          HOST: ${{ matrix.host }}
        run: ./zcutil/build.sh -j"$(nproc)"

      - name: Package zcashd compatibility assets
        shell: bash
        run: |
          chmod +x ./zcutil/package-zcashd-compat.sh
          ./zcutil/package-zcashd-compat.sh \
            --host "${{ matrix.host }}" \
            --version "${{ steps.release-tag.outputs.value }}" \
            --output-dir "./artifacts/${{ matrix.name }}"

      - name: Prepare Docker build context
        if: matrix.name == 'linux-x86_64'
        shell: bash
        env:
          DOCKER_CONTEXT: ${{ runner.temp }}/zcashd-docker-context
        run: |
          set -euo pipefail
          rm -rf "$DOCKER_CONTEXT"
          mkdir -p "$DOCKER_CONTEXT"

          cp \
            ./src/zcashd \
            ./src/zcash-cli \
            ./src/zcash-tx \
            ./src/zcashd-wallet-tool \
            ./zcutil/fetch-params.sh \
            ./contrib/docker/entrypoint.sh \
            "$DOCKER_CONTEXT/"

      - name: Set up Docker Buildx
        if: matrix.name == 'linux-x86_64'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        if: matrix.name == 'linux-x86_64'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: valaroman
          password: ${{ secrets.DOCKERHUB_TOKEN_ZAKURA }}

      - name: Build and push Docker image
        if: matrix.name == 'linux-x86_64'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ${{ runner.temp }}/zcashd-docker-context
          file: ./contrib/docker/source-runtime.Dockerfile
          platforms: linux/amd64
          push: true
          tags: zakuracore/zcashd:${{ steps.release-tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release-tag.outputs.value }}

      - name: Upload matrix artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zcashd-compat-${{ matrix.name }}
          path: ./artifacts/${{ matrix.name }}

  publish-assets:
    name: Publish zcashd compat assets
    needs: build-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Unable to resolve release tag." >&2
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./publish

      - name: Build consolidated manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./publish/final
          RELEASE_TAG="${{ steps.release-tag.outputs.value }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}"

          RELEASE_TAG="$RELEASE_TAG" BASE_URL="$BASE_URL" REPOSITORY="$REPO" python3 - <<'PY'
          import glob
          import json
          import os
          from pathlib import Path

          release_tag = os.environ["RELEASE_TAG"]
          base_url = os.environ["BASE_URL"]
          repository = os.environ["REPOSITORY"]
          files = sorted(glob.glob("./publish/**/*.metadata.json", recursive=True))
          if not files:
            raise SystemExit("No metadata files found.")

          entries = []
          for path in files:
            item = json.loads(Path(path).read_text(encoding="utf-8"))
            item["runtime"]["url"] = f"{base_url}/{item['runtime']['archive']}"
            item["debug"]["url"] = f"{base_url}/{item['debug']['archive']}"
            entries.append(item)

          output = {
            "schema_version": 1,
            "release_tag": release_tag,
            "repository": repository,
            "artifacts": entries,
          }

          Path("./publish/final").mkdir(parents=True, exist_ok=True)
          Path(f"./publish/final/zcashd-zebra-compat-manifest-{release_tag}.json").write_text(
            json.dumps(output, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
          )
          PY

          find ./publish -type f -name '*.tar.gz' -exec cp {} ./publish/final/ \;
          (cd ./publish/final && sha256sum ./* > SHA256SUMS.txt)

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.value }}
          files: |
            ./publish/final/*.tar.gz
            ./publish/final/zcashd-zebra-compat-manifest-*.json
            ./publish/final/SHA256SUMS.txt
